<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Orders - Sub-Admin Panel | Hunny Collection PK</title>
    <link rel="stylesheet" href="../style.css">
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg" sizes="32x32">
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg" sizes="16x16">
    <link rel="icon" type="image/png" href="/assets/logo.jpeg">
    <link rel="shortcut icon" type="image/jpeg" href="/assets/logo.jpeg">
    <link rel="apple-touch-icon" href="/assets/logo.jpeg">
    <link rel="apple-touch-icon-precomposed" href="/assets/logo.jpeg">
    <meta name="msapplication-TileImage" content="/assets/logo.jpeg">
    <meta name="msapplication-TileColor" content="#667eea">
    <meta name="theme-color" content="#667eea">
    <link rel="stylesheet" href="../admin-mobile.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: calc(100vh - 60px);
        }
        .admin-sidebar {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .admin-sidebar h3 {
            color: var(--white);
            margin-bottom: 30px;
            margin-top: 20px;
        }
        .admin-sidebar a {
            display: block;
            color: var(--white);
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
        }
        .admin-content {
            padding: 40px;
            background: var(--soft-pink);
        }
        .admin-card {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--white);
        }
        .stat-label {
            color: var(--white);
            margin-top: 10px;
            opacity: 0.9;
        }
        .btn-sm {
            padding: 8px 15px;
            font-size: 0.9rem;
            margin: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-sm:hover {
            opacity: 0.9;
        }
        .table-responsive { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: #f5f7fa;
            font-weight: 600;
            color: #667eea;
        }
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge-pending { background: #FFF3CD; color: #856404; }
        .badge-confirmed { background: #D1ECF1; color: #0C5460; }
        .badge-shipped { background: #CCE5FF; color: #004085; }
        .badge-delivered { background: #D4EDDA; color: #155724; }
        .badge-cancelled { background: #F8D7DA; color: #721C24; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .filter-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .filter-item label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        .filter-item input,
        .filter-item select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .status-select {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .order-detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .order-detail-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .order-detail-item strong {
            display: block;
            color: #667eea;
            margin-bottom: 8px;
        }
        .order-item-card {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .order-item-card img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
        .no-orders {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        /* Mobile Menu Toggle */
        .admin-menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .admin-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .admin-overlay.active {
            display: block;
        }

        @media (max-width: 1024px) {
            .admin-content {
                padding: 30px 20px;
            }
        }

        @media (max-width: 768px) {
            .admin-menu-toggle {
                display: block !important;
            }

            .admin-sidebar {
                position: fixed;
                top: 0;
                left: -280px;
                width: 280px;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease;
                overflow-y: auto;
                padding-top: 70px;
            }

            .admin-sidebar.active {
                left: 0;
            }

            .admin-overlay.active { display: block; }

            .admin-layout {
                grid-template-columns: 1fr;
            }

            .admin-content {
                padding: 80px 15px 20px;
            }

            .header {
                padding: 10px 15px;
            }

            .nav-menu {
                display: none;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-number {
                font-size: 1.8rem;
            }

            .admin-card {
                padding: 15px;
                margin-bottom: 15px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .table-responsive {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                min-width: 700px;
            }

            th, td {
                padding: 8px 6px;
                font-size: 0.85rem;
            }

            .btn-sm {
                padding: 10px 15px;
                min-height: 44px;
                margin: 3px;
            }

            .modal-content {
                width: 95% !important;
                padding: 20px;
                max-height: 85vh;
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                padding: 12px;
                font-size: 16px;
            }

            .order-detail-grid {
                grid-template-columns: 1fr;
            }

            h2 {
                font-size: 1.3rem !important;
                margin-bottom: 20px !important;
            }

            div[style*="display: flex"] {
                flex-wrap: wrap !important;
                gap: 8px !important;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-number {
                font-size: 1.5rem;
            }

            .btn-sm {
                padding: 5px 8px;
                font-size: 0.75rem;
            }

            table {
                min-width: 600px;
            }

            th, td {
                padding: 6px 4px;
                font-size: 0.8rem;
            }

            h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <script type="module">
        import { checkSubAdminAuth, logout, toggleMobileSidebar, closeMobileSidebar, setupSidebarCloseHandlers, formatCurrency, formatDate, getStatusBadge, showLoading, showError, confirmAction } from './sub-admin-common.js';
        import { getMyOrders, getOrder, updateOrderStatus } from './sub-admin-api.js';
        import { auth } from '../firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // ========== GLOBAL FUNCTIONS ==========
        window.logout = logout;
        window.toggleMobileSidebar = toggleMobileSidebar;
        window.closeMobileSidebar = closeMobileSidebar;

        // ========== STATE ==========
        let allOrders = [];
        let filteredOrders = [];
        let currentUser = null;

        // ========== INITIALIZATION ==========
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'sub-admin-login.html';
                return;
            }

            currentUser = user;
            const isAdmin = await checkSubAdminAuth();
            if (!isAdmin) return;

            setupSidebarCloseHandlers();
            await loadOrders();
        });

        // ========== LOAD ORDERS ==========
        async function loadOrders() {
            try {
                showLoading('orders-container', 'Loading orders...');

                if (!currentUser) return;

                allOrders = await getMyOrders(currentUser.uid);
                filteredOrders = [...allOrders];

                updateStats();
                renderOrders(filteredOrders);
            } catch (error) {
                console.error('Error loading orders:', error);
                showError('Failed to load orders. Please try again.', 'orders-container');
            }
        }

        // ========== UPDATE STATS ==========
        function updateStats() {
            const total = allOrders.length;
            const pending = allOrders.filter(o => o.status === 'pending').length;
            const confirmed = allOrders.filter(o => o.status === 'confirmed').length;
            const delivered = allOrders.filter(o => o.status === 'delivered').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-confirmed').textContent = confirmed;
            document.getElementById('stat-delivered').textContent = delivered;
        }

        // ========== RENDER ORDERS ==========
        function renderOrders(orders) {
            const container = document.getElementById('orders-container');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="no-orders">
                        <h2>No orders found</h2>
                        <p>Orders will appear here once customers start placing them.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            orders.forEach(order => {
                const orderId = `#${order.id.slice(0, 8).toUpperCase()}`;
                const customerName = order.customerName || 'N/A';
                const email = order.email || 'N/A';
                const phone = order.contact || 'N/A';
                const total = order.total || 0;
                const statusBadge = getStatusBadge(order.status);
                const date = formatDate(order.createdAt);

                html += `
                    <tr>
                        <td style="font-weight: 600; color: #667eea;">${orderId}</td>
                        <td>${customerName}</td>
                        <td>${email}</td>
                        <td>${phone}</td>
                        <td style="font-weight: 600;">${formatCurrency(total)}</td>
                        <td>${statusBadge}</td>
                        <td>${date}</td>
                        <td>
                            <select class="status-select" onchange="handleStatusChange('${order.id}', this.value)" style="margin-bottom: 5px;">
                                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                                <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                                <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                            <br>
                            <button class="btn-sm" onclick="viewOrderDetails('${order.id}')">View Details</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // ========== STATUS CHANGE ==========
        window.handleStatusChange = async function(orderId, newStatus) {
            const confirmed = confirmAction(`Update order status to ${newStatus.toUpperCase()}?`);
            if (!confirmed) {
                loadOrders();
                return;
            }

            try {
                if (!currentUser) throw new Error('User not authenticated');
                await updateOrderStatus(orderId, newStatus, currentUser.uid);
                await loadOrders();
                alert('Status updated successfully!');
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Failed to update status. Please try again.');
                loadOrders();
            }
        };

        // ========== VIEW ORDER DETAILS ==========
        window.viewOrderDetails = async function(orderId) {
            try {
                const order = await getOrder(orderId);
                if (!order) {
                    alert('Order not found!');
                    return;
                }

                const orderDate = order.createdAt ? new Date(order.createdAt).toLocaleString() : 'N/A';
                const statusBadge = getStatusBadge(order.status);

                const itemsHtml = (order.items || []).map(item => {
                    const imageUrl = item.images?.[0] || 'https://via.placeholder.com/60';
                    const variant = item.variant ? ` | ${item.variant.size || ''} ${item.variant.color || ''}`.trim() : '';

                    return `
                        <div class="order-item-card">
                            <img src="${imageUrl}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60'">
                            <div style="flex: 1;">
                                <div style="font-weight: 600;">${item.name}</div>
                                <div style="font-size: 0.85rem; color: #666;">
                                    Qty: ${item.quantity || 1}${variant}
                                </div>
                                <div style="color: #667eea; font-weight: 600;">
                                    ${formatCurrency(item.sellingPrice || item.price || 0)}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                const modalHtml = `
                    <div class="order-detail-grid">
                        <div class="order-detail-item">
                            <strong>👤 Customer Information</strong>
                            Name: ${order.customerName || 'N/A'}<br>
                            Contact: ${order.contact || 'N/A'}<br>
                            Email: ${order.email || 'N/A'}
                        </div>
                        <div class="order-detail-item">
                            <strong>📍 Delivery Address</strong>
                            ${order.address?.fullAddress || 'N/A'}<br>
                            ${order.address?.city || 'N/A'}<br>
                            ${order.address?.postalCode || ''}
                        </div>
                        <div class="order-detail-item">
                            <strong>📅 Order Date & Time</strong>
                            ${orderDate}
                        </div>
                        <div class="order-detail-item">
                            <strong>💳 Payment</strong>
                            Method: ${order.paymentMethod || 'COD'}<br>
                            Status: ${order.paymentStatus || 'Pending'}
                        </div>
                        <div class="order-detail-item">
                            <strong>📦 Order Status</strong>
                            ${statusBadge}
                        </div>
                        <div class="order-detail-item">
                            <strong>💰 Total Amount</strong>
                            <span style="font-size: 1.5rem; font-weight: bold; color: #667eea;">
                                ${formatCurrency(order.total || 0)}
                            </span>
                        </div>
                    </div>

                    <h3 style="margin: 20px 0 10px; color: #667eea;">📦 Order Items</h3>
                    ${itemsHtml || '<p>No items found</p>'}

                    ${order.notes ? `
                        <div style="background: #FFF3CD; padding: 15px; border-radius: 8px; margin-top: 20px;">
                            <strong>📝 Customer Notes:</strong><br>
                            ${order.notes}
                        </div>
                    ` : ''}

                    <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--border-color); font-size: 0.85rem; color: #666;">
                        Order ID: ${order.id}<br>
                        Last Updated: ${order.updatedAt ? new Date(order.updatedAt).toLocaleString() : 'N/A'}
                    </div>
                `;

                document.getElementById('modal-title').textContent = `Order #${orderId.slice(0, 8).toUpperCase()}`;
                document.getElementById('modal-body').innerHTML = modalHtml;
                document.getElementById('order-modal').classList.add('active');
            } catch (error) {
                console.error('Error loading order details:', error);
                alert('Failed to load order details. Please try again.');
            }
        };

        // ========== CLOSE MODAL ==========
        window.closeModal = function() {
            document.getElementById('order-modal').classList.remove('active');
        };

        // ========== APPLY FILTERS ==========
        window.applyFilters = function() {
            const statusFilter = document.getElementById('filter-status').value;
            const searchQuery = document.getElementById('filter-search').value.toLowerCase();
            const dateFrom = document.getElementById('filter-date-from').value;
            const dateTo = document.getElementById('filter-date-to').value;

            filteredOrders = [...allOrders];

            if (statusFilter) {
                filteredOrders = filteredOrders.filter(o => o.status === statusFilter);
            }

            if (searchQuery) {
                filteredOrders = filteredOrders.filter(o =>
                    (o.customerName || '').toLowerCase().includes(searchQuery) ||
                    (o.contact || '').includes(searchQuery) ||
                    (o.id || '').toLowerCase().includes(searchQuery) ||
                    (o.email || '').toLowerCase().includes(searchQuery)
                );
            }

            if (dateFrom) {
                const fromDate = new Date(dateFrom);
                filteredOrders = filteredOrders.filter(o => {
                    const orderDate = o.createdAt ? new Date(o.createdAt) : new Date(0);
                    return orderDate >= fromDate;
                });
            }

            if (dateTo) {
                const toDate = new Date(dateTo);
                toDate.setHours(23, 59, 59, 999);
                filteredOrders = filteredOrders.filter(o => {
                    const orderDate = o.createdAt ? new Date(o.createdAt) : new Date(0);
                    return orderDate <= toDate;
                });
            }

            renderOrders(filteredOrders);
        };

        // ========== MOBILE SIDEBAR TOGGLE ==========
        window.toggleAdminMenu = function() {
            toggleMobileSidebar();
        };

        // Close modal on outside click
        document.getElementById('order-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>

    <!-- Sub-Admin Dashboard -->
    <div id="admin-dashboard-view">
        <!-- Mobile Menu Toggle Button -->
        <button class="admin-menu-toggle" onclick="toggleMobileSidebar()">☰</button>

        <!-- Overlay for mobile -->
        <div class="admin-overlay" onclick="toggleMobileSidebar()"></div>

        <header class="header">
            <div class="container">
                <nav class="navbar">
                    <a href="../index.html" class="logo">🌸 Hunny Collection PK - Sub-Admin</a>
                    <ul class="nav-menu">
                        <li><a href="sub-admin.html">Dashboard</a></li>
                        <li><a href="../index.html">Back to Store</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <div class="admin-layout">
            <aside class="admin-sidebar">
                <h3>👤 Sub-Admin Panel</h3>
                <a href="sub-admin.html">Dashboard</a>
                <a href="sub-admin-products.html">📦 My Products</a>
                <a href="sub-admin-orders.html" class="active">📋 My Orders</a>
                <a href="sub-admin-orders-history.html">📊 Orders History</a>
                <a href="#" onclick="logout()">Logout</a>
            </aside>

            <main class="admin-content">
                <!-- Orders Management -->
                <div id="section-orders">
                    <h2 style="color: #667eea; margin-bottom: 30px;">📦 My Orders Management</h2>

                    <!-- Stats -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number" id="stat-total">0</div>
                            <div class="stat-label">Total Orders</div>
                        </div>
                        <div class="stat-card" style="background: linear-gradient(135deg, #FFF3CD 0%, #FFE69C 100%);">
                            <div class="stat-number" style="color: #856404;" id="stat-pending">0</div>
                            <div class="stat-label" style="color: #856404;">Pending</div>
                        </div>
                        <div class="stat-card" style="background: linear-gradient(135deg, #D1ECF1 0%, #A3D5FF 100%);">
                            <div class="stat-number" style="color: #0C5460;" id="stat-confirmed">0</div>
                            <div class="stat-label" style="color: #0C5460;">Confirmed</div>
                        </div>
                        <div class="stat-card" style="background: linear-gradient(135deg, #D4EDDA 0%, #C3E6CB 100%);">
                            <div class="stat-number" style="color: #155724;" id="stat-delivered">0</div>
                            <div class="stat-label" style="color: #155724;">Delivered</div>
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="filter-bar">
                        <h3 style="margin-bottom: 15px;">🔍 Filter & Search Orders</h3>
                        <div class="filter-grid">
                            <div class="filter-item">
                                <label>🔎 Search</label>
                                <input type="text" id="filter-search" placeholder="Customer name, email, phone, order ID..." oninput="applyFilters()">
                            </div>
                            <div class="filter-item">
                                <label>📦 Status</label>
                                <select id="filter-status" onchange="applyFilters()">
                                    <option value="">All Statuses</option>
                                    <option value="pending">Pending</option>
                                    <option value="confirmed">Confirmed</option>
                                    <option value="shipped">Shipped</option>
                                    <option value="delivered">Delivered</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label>📅 Date From</label>
                                <input type="date" id="filter-date-from" onchange="applyFilters()">
                            </div>
                            <div class="filter-item">
                                <label>📅 Date To</label>
                                <input type="date" id="filter-date-to" onchange="applyFilters()">
                            </div>
                        </div>
                    </div>

                    <!-- Orders Table -->
                    <div class="admin-card">
                        <div class="table-responsive">
                            <div id="orders-container">
                                <div class="loading">Loading orders...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div id="order-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Order Details</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>
</body>
</html>
