<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Management - Admin Dashboard</title>
    <link rel="stylesheet" href="../admin-mobile.css">
    <style>
        .chat-admin-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 70px);
            background: #f5f5f5;
        }

        .chat-list-panel {
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .chat-list-header {
            padding: 20px;
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            color: white;
        }

        .chat-list-header h2 {
            margin: 0;
            font-size: 1.3rem;
        }

        .chat-list-header p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .chat-list-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-list-item:hover {
            background: #fff5f8;
        }

        .chat-list-item.active {
            background: #ffe4e1;
            border-left: 4px solid #FF69B4;
        }

        .chat-list-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .chat-list-item-name {
            font-weight: 600;
            color: #333;
        }

        .chat-list-item-time {
            font-size: 0.8rem;
            color: #999;
        }

        .chat-list-item-preview {
            font-size: 0.9rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-list-item-badge {
            display: inline-block;
            background: #FF69B4;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        .chat-messages-panel {
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-messages-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .chat-messages-header h3 {
            margin: 0 0 5px 0;
        }

        .chat-messages-header p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }

        .chat-messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message-bubble {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message-bubble.user {
            align-items: flex-start;
        }

        .message-bubble.admin {
            align-items: flex-end;
        }

        .message-bubble-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
        }

        .message-bubble.user .message-bubble-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message-bubble.admin .message-bubble-content {
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
            padding: 0 8px;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: #FF69B4;
        }

        .chat-send-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no-chat-selected {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 1.1rem;
        }

        .empty-chat-list {
            padding: 40px 20px;
            text-align: center;
            color: #999;
        }

        @media (max-width: 768px) {
            .chat-admin-container {
                grid-template-columns: 1fr;
            }

            .chat-list-panel {
                display: none;
            }

            .chat-list-panel.active {
                display: block;
            }

            .chat-messages-panel {
                display: none;
            }

            .chat-messages-panel.active {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="../admin.html" class="logo">
                    <img src="../assets/logo.jpeg" alt="Logo" class="logo-image">
                    <span class="logo-text">🌸 Admin Chat</span>
                </a>
                <div class="header-actions">
                    <a href="../admin.html" class="btn-secondary">← Back to Dashboard</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="chat-admin-container">
        <div class="chat-list-panel" id="chat-list-panel">
            <div class="chat-list-header">
                <h2>💬 User Chats</h2>
                <p>Messages auto-delete after 24 hours</p>
            </div>
            <div id="chat-list-container">
                <div class="empty-chat-list">
                    <p>Loading chats...</p>
                </div>
            </div>
        </div>

        <div class="chat-messages-panel" id="chat-messages-panel">
            <div id="chat-messages-area">
                <div class="no-chat-selected">
                    <div>
                        <p style="font-size: 3rem; text-align: center; margin-bottom: 20px;">💬</p>
                        <p style="text-align: center;">Select a conversation to start chatting</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from '../firebase-config.js';
        import { 
            collection, 
            addDoc, 
            query, 
            orderBy, 
            onSnapshot, 
            serverTimestamp, 
            where,
            doc,
            getDoc,
            setDoc
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { checkAdminAccess } from '../admin-common.js';

        let currentUser = null;
        let currentChatId = null;
        let currentChatData = null;
        let messagesUnsubscribe = null;
        const MESSAGE_TTL_HOURS = 24;

        // Check admin access
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }

            const isAdmin = await checkAdminAccess(user);
            if (!isAdmin) {
                alert('Access denied. Admin privileges required.');
                window.location.href = '../admin.html';
                return;
            }

            currentUser = user;
            loadChatList();
        });

        // Load all chat conversations
        function loadChatList() {
            const chatsQuery = query(
                collection(db, 'chats'),
                orderBy('lastMessageAt', 'desc')
            );

            onSnapshot(chatsQuery, (snapshot) => {
                const container = document.getElementById('chat-list-container');

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-chat-list">
                            <p style="font-size: 3rem; margin-bottom: 20px;">💭</p>
                            <p>No active conversations yet</p>
                            <p style="font-size: 0.85rem; margin-top: 10px;">User chats will appear here when they send messages</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                const now = new Date();

                snapshot.forEach((docSnap) => {
                    const chatData = docSnap.data();
                    const chatId = docSnap.id;
                    
                    const div = document.createElement('div');
                    div.className = 'chat-list-item';
                    if (currentChatId === chatId) {
                        div.classList.add('active');
                    }

                    const lastMessageTime = chatData.lastMessageAt ? 
                        chatData.lastMessageAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                    
                    const lastMessagePreview = chatData.lastMessage || 'No messages yet';

                    div.innerHTML = `
                        <div class="chat-list-item-header">
                            <span class="chat-list-item-name">${chatData.userName}</span>
                            <span class="chat-list-item-time">${lastMessageTime}</span>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="chat-list-item-preview">${lastMessagePreview}</span>
                        </div>
                    `;

                    div.onclick = () => openChat(chatId, chatData);
                    container.appendChild(div);
                });
            });
        }

        // Open a specific chat
        function openChat(chatId, chatData) {
            currentChatId = chatId;
            currentChatData = chatData;

            // Update active state in list
            document.querySelectorAll('.chat-list-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Update messages area
            const messagesArea = document.getElementById('chat-messages-area');
            messagesArea.innerHTML = `
                <div class="chat-messages-header">
                    <h3>💬 Chat with ${chatData.userName}</h3>
                    <p>${chatData.userEmail}</p>
                </div>
                <div class="chat-messages-container" id="chat-messages-container"></div>
                <div class="chat-input-container">
                    <input type="text" id="admin-chat-input" class="chat-input" placeholder="Type your reply..." maxlength="1000">
                    <button id="admin-chat-send" class="chat-send-btn">Send</button>
                </div>
            `;

            // Load messages
            loadMessages(chatId);

            // Setup send button
            document.getElementById('admin-chat-send').onclick = sendAdminMessage;
            document.getElementById('admin-chat-input').onkeypress = (e) => {
                if (e.key === 'Enter') {
                    sendAdminMessage();
                }
            };
        }

        // Load messages for a chat
        function loadMessages(chatId) {
            if (messagesUnsubscribe) {
                messagesUnsubscribe();
            }

            const container = document.getElementById('chat-messages-container');
            if (!container) return;

            const messagesQuery = query(
                collection(db, 'messages'),
                where('chatId', '==', chatId),
                orderBy('timestamp', 'asc')
            );

            messagesUnsubscribe = onSnapshot(messagesQuery, (snapshot) => {
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: #999;">
                            <p style="font-size: 3rem; margin-bottom: 20px;">💭</p>
                            <p>No messages yet</p>
                        </div>
                    `;
                    return;
                }

                const now = new Date();

                snapshot.forEach((doc) => {
                    const messageData = doc.data();
                    const expiresAt = new Date(messageData.expiresAt);

                    // Skip expired messages
                    if (now >= expiresAt) {
                        return;
                    }

                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message-bubble ${messageData.senderType}`;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'message-bubble-content';
                    contentDiv.textContent = messageData.message;

                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'message-time';

                    if (messageData.timestamp) {
                        const date = messageData.timestamp.toDate();
                        timeDiv.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }

                    messageDiv.appendChild(contentDiv);
                    messageDiv.appendChild(timeDiv);
                    container.appendChild(messageDiv);
                });

                container.scrollTop = container.scrollHeight;
            });
        }

        // Send admin message
        async function sendAdminMessage() {
            const input = document.getElementById('admin-chat-input');
            const sendBtn = document.getElementById('admin-chat-send');
            
            if (!input || !sendBtn) return;

            const messageText = input.value.trim();
            if (!messageText || !currentUser || !currentChatId) return;

            sendBtn.disabled = true;

            try {
                const messageData = {
                    chatId: currentChatId,
                    senderId: currentUser.uid,
                    senderName: 'Admin',
                    senderType: 'admin',
                    message: messageText,
                    timestamp: serverTimestamp(),
                    expiresAt: new Date(Date.now() + MESSAGE_TTL_HOURS * 60 * 60 * 1000).toISOString(),
                    isRead: false
                };

                await addDoc(collection(db, 'messages'), messageData);

                // Update chat room
                await setDoc(doc(db, 'chats', currentChatId), {
                    lastMessage: messageText.substring(0, 100),
                    lastMessageAt: serverTimestamp(),
                    lastMessageSender: 'admin'
                }, { merge: true });

                input.value = '';
                input.focus();
            } catch (error) {
                console.error('Error sending admin message:', error);
                alert('Failed to send message. Please try again.');
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Make openChat available globally
        window.openChat = openChat;
    </script>
</body>
</html>
